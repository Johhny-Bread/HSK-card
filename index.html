<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSK 단어 카드</title>
<meta name="description" content="신HSK 4·5급 단어 2,000여 개를 예문, 단어 풀이, 간격 반복으로 외우는 카드 앱">
<meta name="theme-color" content="#16705C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK 카드">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.foot a{color:inherit}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nunito:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app — top bar, a single study card that fills the middle, thumb-reach actions at the bottom */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#18221E; --muted:#5D6B64; --line:#D3DBD6;
  --jade:#16705C; --jade-ink:#FFFFFF; --jade-soft:#D9ECE5;
  --seal:#BE3B28; --seal-soft:#F7E0DA; --amber:#A86A12; --amber-soft:#F6E8CF;
  --hanzi:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --py:"Nunito","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#1A221E; --ink:#E4EBE7; --muted:#92A199; --line:#2B3631;
  --jade:#4CB894; --jade-ink:#0D1A15; --jade-soft:#1D372E;
  --seal:#EC7A66; --seal-soft:#3A221D; --amber:#E2AA4E; --amber-soft:#382C17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#1A221E; --ink:#E4EBE7; --muted:#92A199; --line:#2B3631;
  --jade:#4CB894; --jade-ink:#0D1A15; --jade-soft:#1D372E;
  --seal:#EC7A66; --seal-soft:#3A221D; --amber:#E2AA4E; --amber-soft:#382C17; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.hz{font-family:var(--hanzi)}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--jade-soft)}
.iconbtn svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding-block:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* home */
.hero{display:flex;flex-direction:column;gap:4px;padding-block:8px 4px}
.hero .big{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .big span{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvlrow{display:flex;justify-content:space-between;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--jade)} .bar .l{background:var(--amber)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.primary{background:var(--jade);color:var(--jade-ink);border-radius:16px;min-height:56px;font-size:17px;font-weight:700;width:100%}
.primary:disabled{opacity:.45}
.secondary{background:var(--surface);border-radius:16px;min-height:52px;font-weight:500;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--jade-soft);color:var(--ink);font-weight:700}
.setting{display:flex;flex-direction:column;gap:6px}
.setting label{font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center}
/* study */
.progress{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);transition:width .25s}
.card{flex:1;min-height:0;background:var(--surface);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.kind{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.stamp{font-family:var(--hanzi);font-size:11px;font-weight:700;color:var(--seal);border:1.5px solid var(--seal);border-radius:4px;padding:0 5px;letter-spacing:0}
.word{font-size:64px;font-weight:700;line-height:1.15;text-align:center;padding-top:8px;word-break:keep-all}
.py{font-size:20px;text-align:center;color:var(--jade);font-weight:500}
.mean{font-size:19px;text-align:center;font-weight:700}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ex{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ex .zh{font-family:var(--hanzi);font-size:21px;line-height:1.6}
.ex .zh mark{background:var(--jade-soft);color:var(--ink);border-radius:4px;padding:0 2px}
.ex .ko{font-size:14px;color:var(--muted)}
.ex .ko.hide{color:transparent;background:var(--line);border-radius:6px;user-select:none}
.exhead{display:flex;align-items:center;justify-content:space-between}
.speak{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--jade);min-height:36px;padding:0 10px;border-radius:10px;background:var(--jade-soft)}
.speak svg{width:16px;height:16px}
.tip{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.tip b{color:var(--amber);font-size:12px;display:block}
.blank{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--jade);text-align:center}
.cloze{font-family:var(--hanzi);font-size:24px;line-height:1.7}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-height:54px;padding:8px 12px;text-align:left;font-size:16px}
.opts.two .opt{text-align:center;font-family:var(--hanzi);font-size:24px}
.opt.right{border-color:var(--jade);background:var(--jade-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.actions{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{min-height:60px;border-radius:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.grades button small{font-weight:400;font-size:11px;opacity:.8}
.undo{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:10px;background:var(--surface);color:var(--muted);font-family:var(--display);font-size:14px}
.undo svg,.secondary svg{width:16px;height:16px}
.word.long{font-size:40px}
.list{overflow:hidden}
.item{grid-template-columns:auto minmax(0,1fr) auto}
.item{box-sizing:border-box}
.item>*{min-width:0}
.item .mini,.item .chip,.item .dots{min-width:max-content}
.item .hz{font-size:20px}
.detail{min-width:0}
.ex .zh{overflow-wrap:anywhere}
.sg{cursor:pointer;border-radius:4px;padding:0 1px}
.sg.hit{background:var(--jade-soft)}
.sg.on{background:var(--amber-soft);box-shadow:0 0 0 1.5px var(--amber)}
.zh[data-e]{cursor:pointer}
.gloss{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:15px;font-family:var(--display)}
.gloss[hidden]{display:none}
.gloss .hz{font-size:22px;font-weight:700}
.gloss .py{font-size:15px;text-align:left}
.gloss .gm{flex:1;min-width:0}
.gloss .speak{padding:0 8px}
.chip{font-family:var(--display);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade);white-space:nowrap}
.mini{font-family:var(--display);font-size:13px;padding:6px 10px;border-radius:10px;background:var(--seal-soft);color:var(--seal);white-space:nowrap}
.mini.ok{background:var(--jade-soft);color:var(--jade)}
.stat.link{cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat.link span::after{content:" ›"}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:18px;padding:4px;margin-top:10px}
.tabbar button{white-space:nowrap;min-height:46px;border-radius:14px;font-family:var(--display);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.tabbar button b{font-family:var(--hanzi);font-size:18px;font-weight:700}
.tabbar button[aria-current="page"]{background:var(--jade-soft);color:var(--jade)}
.hgroup{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hhead{display:flex;align-items:center;gap:8px}
.hhead .lab{flex:1;min-width:0;font-family:var(--display);font-size:15px}
.hhead .num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hchars{display:flex;flex-wrap:wrap;gap:6px}
.hchar{width:46px;height:46px;border-radius:12px;background:var(--bg);font-family:var(--hanzi);font-size:24px;font-weight:700;display:grid;place-items:center}
.hchar.on{background:var(--jade);color:var(--jade-ink)}
.hwords{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hword{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hword:last-child{border-bottom:0}
.hword .hz{font-size:22px;font-weight:700;grid-row:span 2}
.hword .hz mark{background:var(--jade-soft);color:var(--ink);border-radius:4px}
.hword .p{font-family:var(--py);font-weight:700;font-size:13px;color:var(--jade)}
.hword .m{font-size:14px}
.hword .speak{grid-row:span 2;padding:0 8px}
.drillq{font-family:var(--hanzi);font-size:52px;font-weight:700;text-align:center;letter-spacing:.04em}
.drillq .blank{min-width:1.1em}
.opts.six{grid-template-columns:repeat(3,1fr)}
.opts.six .opt{text-align:center;font-family:var(--hanzi);font-size:30px;min-height:64px;font-weight:700}
.grades.two{grid-template-columns:1fr 1fr}
.g0{background:var(--seal-soft);color:var(--seal)}
.g1{background:var(--amber-soft);color:var(--amber)}
.g2{background:var(--jade-soft);color:var(--jade)}
.peek{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:76px;justify-content:center;border:1.5px dashed var(--line);border-radius:14px;padding:8px 12px;position:relative}
.peek .py,.peek .mean{visibility:hidden}
.peek-hint{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.peek.open{border-color:transparent}
.peek.open .py,.peek.open .mean{visibility:visible}
.peek.open .peek-hint{display:none}
.ex .ko.hide::before{content:"해석 보기";color:var(--muted);padding-left:10px}
.ex .ko.hide{font-size:0;min-height:36px;display:flex;align-items:center}
.ex .ko.hide::before{font-size:13px}
.fbh{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:14px;padding:10px 12px}
.fbh .hz{font-size:34px;font-weight:700;line-height:1.1}
.verdict{font-weight:700;text-align:center;font-size:15px}
.verdict.ok{color:var(--jade)} .verdict.no{color:var(--seal)}
.pybtn{align-self:center;font-size:13px;color:var(--muted);min-height:32px;padding:0 10px;border-radius:8px;border:1px dashed var(--line)}
/* list */
.search{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;font:inherit;color:var(--ink);width:100%;box-sizing:border-box}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px}
.item{cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .hz{font-size:22px;font-weight:700;grid-row:span 2}
.item .p{font-size:13px;color:var(--jade)}
.item .m{font-size:14px;min-width:0}
.dots{display:flex;gap:3px;grid-row:span 2}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--jade)}
.dots.weak i.on{background:var(--seal)}
.detail{grid-column:1/-1;padding-top:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-height:64px;padding:8px;font-size:14px;transition:opacity .3s,transform .15s}
.tile.hzt{font-family:var(--hanzi);font-size:24px;font-weight:700}
.tile.sel{border-color:var(--jade);background:var(--jade-soft)}
.tile.bad{border-color:var(--seal);background:var(--seal-soft)}
.tile.done{opacity:0;pointer-events:none}
.done-box{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.done-box .big{font-family:var(--hanzi);font-size:56px;font-weight:700;color:var(--jade)}
.top h1,.hero .big,.stat b,.primary,.secondary,.mean,.verdict,.grades button,.seg button,.peek-hint,.speak,.kind,.done-box,.item .m,.opt{font-family:var(--display);font-weight:400}
.word{font-weight:700}
.ex .zh,.cloze{font-weight:500}
.py,.item .p{font-family:var(--py);font-weight:700}
.stamp{font-weight:400}
.card,.stat,.primary,.secondary,.opt,.tile{border-radius:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>

<script src="words.js"></script>
<script src="gloss.js"></script>
<script src="hanzi.js"></script>
<script>
(() => {
"use strict";
const INT = [0,1,2,4,7,15,30,60];              // 복습 간격(일) — 상자 번호별
const W = WORDS.map(a => ({h:a[0],p:a[1],m:a[2],l:a[3],e:a[4],t:a[5],n:a[6]||"",c:0,pat:""}))
  .concat(CONJ.map(a => ({h:a[0],pat:a[1],p:a[2],m:a[3],l:a[4],e:a[5],t:a[6],n:a[7]||"",c:1})));
const disp = w => w.pat || w.h;                       // 접속사는 짝 패턴으로 보여줌
const parts = w => (w.pat || w.h).split(/[…，]/).filter(Boolean);
const BY = Object.fromEntries(W.map(w => [w.h, w]));
const KEY = "hsk-cards-v1";
const $app = document.getElementById("app");
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 86400000); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- state ---------- */
function fresh(){ return {v:1, updated:0, cards:{}, newPerDay:10, levels:"45", newDay:0, newCount:0, streak:0, lastDay:0, doneToday:0, pinyinHint:false}; }
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
const fixNPD = () => { if (![10,20,30].includes(S.newPerDay)) S.newPerDay = 10; };
fixNPD();

let db = null, docRef = null, syncLabel = "이 기기에만 저장", writing = false, pending = false, timer = null;
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (docRef){ clearTimeout(timer); timer = setTimeout(pushRemote, 1500); }
}
async function pushRemote(){
  if (writing){ pending = true; return; }
  writing = true;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); } catch(e) {}
  writing = false;
  if (pending){ pending = false; pushRemote(); }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u, sm] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("sample")]);
    if (sm){ sampleFn = sm; refreshHints(); }
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    db = d; docRef = db.collection("data/users/" + id).doc("progress");
    glossRef = db.collection("data/users/" + id).doc("gloss");
    glossRef.get().then(g => { if (g.exists){ const m = g.data().map || {}; let add = 0; for (const k in m) if (!G[k]){ G[k] = m[k]; add++; } if (add) saveGlossLocal(); } }).catch(()=>{});
    const snap = await Promise.race([docRef.get(), new Promise((_,r)=>setTimeout(()=>r("timeout"),10000))]);
    syncLabel = "계정에 저장 · 다른 기기에서도 이어서";
    if (snap.exists){
      const r = snap.data();
      if ((r.updated||0) > (S.updated||0)){ S = Object.assign(fresh(), r); fixNPD(); try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} }
      else if ((S.updated||0) > (r.updated||0)) pushRemote();
    } else if (S.updated) pushRemote();
    if (view === "home") renderHome();
  } catch(e) {}
})();

/* ---------- example word gloss (Claude가 문장을 단어별로 풀이, 한 번 받으면 저장) ---------- */
const GKEY = "hsk-gloss-v1";
let G = {}, sampleFn = null, glossRef = null, gTimer = null;
try { G = JSON.parse(localStorage.getItem(GKEY) || "{}"); } catch(e) {}
// 미리 만들어 둔 풀이 (폰·오프라인에서도 바로 동작)
try { for (const k in GLOSS) G[k] = GLOSS[k].map(t => typeof t === "string" ? {w:t,p:"",m:""} : {w:t[0],p:t[1],m:t[2]}); } catch(e) {}
function saveGlossLocal(){ try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch(e) {} }
function saveGloss(){
  saveGlossLocal();
  if (glossRef){ clearTimeout(gTimer); gTimer = setTimeout(() => glossRef.set({map: G}).catch(()=>{}), 2000); }
}
function refreshHints(){ document.querySelectorAll(".ghint").forEach(x => x.hidden = false); }
async function fetchGloss(sent){
  const prompt = `중국어 문장을 단어 단위로 나눠 주세요. 각 단어에 병음(성조 부호 포함)과, 이 문장 속에서의 뜻을 짧은 한국어로 붙입니다. 문장 부호와 숫자·영문도 하나의 항목으로 넣되 p와 m은 빈 문자열로 둡니다. 모든 w를 순서대로 이어 붙이면 원문과 글자 하나까지 똑같아야 합니다. JSON 배열만 답하세요: [{"w":"단어","p":"병음","m":"뜻"}]\n\n문장: ${sent}`;
  const r = await sampleFn.json(prompt, {modelTier: "quick"});
  if (!Array.isArray(r)) throw {code: "bad"};
  const toks = r.map(x => ({w: String(x.w || ""), p: String(x.p || ""), m: String(x.m || "")})).filter(x => x.w);
  if (toks.map(x => x.w).join("").replace(/\s/g, "") !== sent.replace(/\s/g, "")) throw {code: "bad"};
  G[sent] = toks; saveGloss();
  return toks;
}
function zhInner(w){
  const ps = parts(w), toks = G[w.e];
  if (toks) return toks.map((t, i) => {
    const hit = ps.includes(t.w) || t.w.includes(w.h);
    return t.p ? `<span class="sg${hit ? " hit" : ""}" data-i="${i}">${esc(t.w)}</span>` : esc(t.w);
  }).join("");
  let s = esc(w.e), from = 0;
  for (const p of ps){ const k = s.indexOf(esc(p), from); if (k < 0) continue; s = s.slice(0, k) + "<mark>" + esc(p) + "</mark>" + s.slice(k + esc(p).length); from = k + 13 + esc(p).length; }
  return s;
}

/* ---------- SRS ---------- */
let only = null;   // 접속사만 공부할 때 범위 덮어쓰기
// "45"는 공식 4·5급 + 보충 단어(l=0), "4"/"5"는 공식 급수만
const pool = () => only ? W.filter(only) : W.filter(w => S.levels === "45" ? true : String(w.l) === S.levels);
const lvTag = w => w.l ? w.l + "级" : "补充";
const card = h => S.cards[h];
const isWeak = c => c && c.s && !c.k && (c.x >= 2 || c.b <= 1);
// 알고 있음 → 다시 안 나옴 (단어장에서 되돌릴 수 있음)
function retire(h){ const c = S.cards[h]; c.t = today(); c.k = 1; c.s = 1; c.b = Math.max(c.b, 3); bumpDay(); save(); }
function dueList(){ const t = today(); return pool().filter(w => card(w.h) && !card(w.h).k && card(w.h).d <= t).sort((a,b)=>card(a.h).d-card(b.h).d); }
function newLeft(){ if (S.newDay !== today()){ S.newDay = today(); S.newCount = 0; } return Math.max(0, S.newPerDay - S.newCount); }
function unseen(){ return pool().filter(w => !card(w.h)); }
function bumpDay(){
  const t = today();
  if (S.lastDay !== t){ S.streak = (S.lastDay === t-1) ? S.streak + 1 : 1; S.lastDay = t; S.doneToday = 0; }
  S.doneToday++;
}
// g: 0 몰랐음, 1 헷갈림, 2 알았음
function grade(h, g, failedInSession){
  const c = S.cards[h], t = today();
  c.t = t;
  if (g === 0){ c.b = 0; c.d = t; c.x = (c.x||0) + 1; }
  else if (failedInSession){ c.b = 1; c.d = t + 1; }
  else if (g === 1){ c.b = Math.max(1, c.b); c.d = t + 1; }
  else { c.b = Math.min(7, c.b + 1); c.d = t + INT[c.b]; }
  c.s = 1;
  bumpDay(); save();
  return c;
}
function nextLabel(c){ const d = c.d - today(); return d <= 0 ? "이번 세트에서 다시" : d === 1 ? "내일 다시" : d + "일 뒤 복습"; }

let zhVoice = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices(); zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; } catch(e){} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch(e){}
function say(text){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = .9; speechSynthesis.speak(u); } catch(e){}
}

/* ---------- session ---------- */
let Q = [], qi = 0, failed = new Set(), total = 0;
let mode = "all";
function startSession(m){
  mode = m; only = m === "conj" ? (w => w.c) : null;
  Q = []; qi = 0; failed = new Set(); hist = [];
  // 한 세트 ≈ 10장: 복습 최대 10장, 남는 자리에 새 단어 (새 단어 1개 = 소개 + 확인 2장)
  const due = dueList().slice(0, 10);
  const room = Math.floor((10 - due.length) / 2);
  const nN = m === "conj" ? room : Math.min(newLeft(), room);
  const news = shuffle(unseen()).slice(0, nN);
  only = null;
  shuffle(due).forEach(w => Q.push({w, type: pickType(card(w.h))}));
  // 새 단어: 소개 → 2장 뒤에 4지선다로 확인
  news.forEach((w, i) => {
    const at = Math.min(Q.length, i * 2 + Math.floor(Q.length / 2));
    Q.splice(at, 0, {w, type:"intro"});
  });
  for (let i = Q.length - 1; i >= 0; i--) if (Q[i].type === "intro") Q.splice(Math.min(Q.length, i + 3), 0, {w:Q[i].w, type:"mc"});
  if (!Q.length){ renderHome(); return; }
  total = Q.length;
  view = "study"; renderCard();
}
function pickType(c){
  if (!c || c.b <= 1) return Math.random() < .5 ? "mc" : "mcr";
  if (c.b === 2) return "cloze";
  return ["flip","cloze","flip"][Math.random()*3|0];
}
function requeue(w){ const at = Math.min(Q.length, qi + 1 + 3); Q.splice(at, 0, {w, type: Math.random()<.5 ? "mc" : "cloze"}); total++; }
function distractors(w, key, n){
  const same = W.filter(x => x.h !== w.h && x[key] !== w[key]);
  const close = shuffle(same.filter(x => x.l === w.l && (key !== "h" || x.h.length === w.h.length)));
  const pick = []; for (const x of close.concat(shuffle(same))) { if (!pick.some(p => p[key] === x[key])) pick.push(x); if (pick.length === n) break; }
  return pick;
}
function shell(inner, kind, w){
  const done = Math.min(qi, total);
  $app.innerHTML = `<div class="top"><button class="iconbtn" id="quit" aria-label="그만하기">${ICON.x}</button>
    ${hist.length > 1 ? `<button class="undo" id="undo" aria-label="이전 카드로">${ICON.undo}이전</button>` : ""}
    <div class="progress"><i style="width:${done/total*100}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${done}/${total}</span></div>
    <div class="scroll"><div class="card"><div class="kind"><span class="stamp">${lvTag(w)}</span>${kind}</div>${inner}</div></div>
    <div class="actions" id="act"></div>`;
  document.getElementById("quit").onclick = renderHome;
  const u = document.getElementById("undo"); if (u) u.onclick = undo;
  return document.getElementById("act");
}
function next(){ qi++; if (qi >= Q.length) renderDone(); else renderCard(); }
// 되돌리기: 카드마다 그 카드를 풀기 직전 상태를 저장
let hist = [];
const snap = () => ({S: JSON.stringify(S), Q: Q.slice(), qi, failed: [...failed], total});
function undo(){
  if (view !== "done") hist.pop();        // 지금 카드의 스냅샷은 버리고
  const t = hist.pop(); if (!t) return;    // 바로 앞 카드 직전 상태로
  S = JSON.parse(t.S); Q = t.Q; qi = t.qi; failed = new Set(t.failed); total = t.total;
  save(); view = "study"; renderCard();
}
function renderCard(){
  hist.push(snap()); if (hist.length > 50) hist.shift();
  const {w, type} = Q[qi];
  if (!card(w.h) && type !== "intro"){ S.cards[w.h] = {b:0,d:today(),x:0,s:0}; }
  ({intro, mc, mcr, cloze, flip})[type](w);
}
function intro(w){
  const act = shell(`<div class="center">${hiddenHead(w)}</div>${exampleHTML(w,true)}`, "새 단어", w);
  act.innerHTML = `<div class="grades two">
      <button class="g0" id="ok">모름<small>외우고 확인</small></button>
      <button class="g2" id="known">알고 있음<small>다시 안 나와요</small></button></div>`;
  const add = () => { if (!card(w.h)){ S.cards[w.h] = {b:0,d:today(),x:0,s:0}; newLeft(); S.newCount++; } S.cards[w.h].t = today(); };
  act.querySelector("#ok").onclick = () => { add(); save(); next(); };
  act.querySelector("#known").onclick = () => {
    add();
    // 이미 아는 단어면 뒤에 잡혀 있던 확인 문제는 빼기
    for (let i = Q.length - 1; i > qi; i--) if (Q[i].w === w){ Q.splice(i, 1); total--; }
    retire(w.h); next();
  };
}
function feedback(w, ok, kind){
  const c = grade(w.h, ok ? 2 : 0, failed.has(w.h));
  if (!ok){ failed.add(w.h); requeue(w); }
  const sc = document.querySelector(".card");
  const fb = document.createElement("div");
  fb.innerHTML = `<div class="verdict ${ok?"ok":"no"}">${ok ? "정답 · " + nextLabel(c) : "오답 · 몇 장 뒤에 다시 나와요"}</div>
    <div class="fbh"><span class="hz">${esc(disp(w))}</span><div style="flex:1;min-width:0"><div class="py" style="text-align:left;font-size:16px">${esc(w.p)}</div><div style="font-weight:700">${esc(w.m)}</div></div>
    <button class="speak" data-say="${esc(w.h)}" aria-label="발음 듣기">${ICON.spk}</button></div>${exampleHTML(w, false)}`;
  fb.style.cssText = "display:flex;flex-direction:column;gap:12px";
  const pb = document.getElementById("pyb"); if (pb) pb.remove();
  sc.appendChild(fb);
  sc.scrollTo({top: Math.max(0, fb.offsetTop - sc.offsetTop - 8), behavior: "smooth"});
  if (ok) say(w.h);
  const act = document.getElementById("act");
  act.innerHTML = `<button class="primary" id="nx">다음</button>`;
  act.querySelector("#nx").onclick = next;
}
function choice(w, prompt, kind, key, g2){
  const opts = shuffle([w, ...distractors(w, key, 3)]);
  const act = shell(prompt + `<div class="opts${g2?" two":""}" id="opts">${opts.map(o=>`<button class="opt" data-h="${esc(o.h)}">${esc(key === "h" ? disp(o) : o[key])}</button>`).join("")}</div>`, kind, w);
  act.innerHTML = "";
  document.getElementById("opts").onclick = e => {
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    const ok = b.dataset.h === w.h;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.h === w.h) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    feedback(w, ok, kind);
  };
}
function mc(w){
  choice(w, `<div class="center"><div class="${wordCls(w)}">${esc(disp(w))}</div>
    ${S.pinyinHint ? `<div class="py">${esc(w.p)}</div>` : `<button class="pybtn" id="pyb">병음 보기</button>`}
    <button class="speak" style="align-self:center" data-say="${esc(w.h)}">${ICON.spk}발음 듣기</button></div>`, "뜻 고르기", "m", false);
  const pb = document.getElementById("pyb"); if (pb) pb.onclick = () => { pb.outerHTML = `<div class="py">${esc(w.p)}</div>`; };
}
function mcr(w){
  choice(w, `<div class="center"><div class="small muted" style="text-align:center">이 뜻의 단어는?</div><div class="mean" style="font-size:24px">${esc(w.m)}</div></div>`, "단어 고르기", "h", true);
}
function cloze(w){
  const s = esc(w.e).replace(esc(w.h), `<span class="blank">${"＿".repeat(w.h.length)}</span>`);
  choice(w, `<div class="center"><div class="small muted">빈칸에 들어갈 단어는?</div><div class="cloze">${s}</div>
    <div class="ex" style="border:0;padding:0"><div class="ko hide" role="button" tabindex="0" data-reveal>${esc(w.t)}</div></div></div>`, "예문 빈칸", "h", true);
}
function flip(w){
  const act = shell(`<div class="center"><div class="${wordCls(w)}">${esc(disp(w))}</div><div class="small muted" style="text-align:center">예문을 보고 뜻과 발음을 떠올려 보세요</div></div>${exampleHTML(w,true)}`, "떠올리기", w);
  act.innerHTML = `<button class="primary" id="show">정답 보기</button>`;
  act.querySelector("#show").onclick = () => {
    document.querySelector(".card").innerHTML = `<div class="kind"><span class="stamp">${lvTag(w)}</span>떠올리기</div><div style="display:flex;flex-direction:column;gap:6px">${wordHead(w)}</div>${exampleHTML(w,true)}`;
    say(w.h);
    act.innerHTML = `<div class="grades two">
      <button class="g0" data-g="0">모름<small>곧 다시</small></button>
      <button class="g2" data-g="2">알고 있음<small>${failed.has(w.h) ? "내일 한 번 더" : "다시 안 나와요"}</small></button></div>`;
    act.querySelector(".grades").onclick = e => {
      const btn = e.target.closest("button"); if (!btn) return;
      const g = +btn.dataset.g;
      if (g === 2 && !failed.has(w.h)) retire(w.h); else grade(w.h, g, failed.has(w.h));
      if (g === 0){ failed.add(w.h); requeue(w); }
      next();
    };
  };
}
function renderDone(){
  view = "done";
  const wrong = [...failed].map(h => BY[h]);
  $app.innerHTML = `<div class="top"><h1>세트 완료</h1></div>
  <div class="done-box">
    <div class="big">好!</div>
    <div>${total}장을 풀었어요${wrong.length ? `, 틀린 단어 ${wrong.length}개는 내일 다시 나와요` : ", 하나도 안 틀렸어요"}</div>
    ${wrong.length ? `<div class="small muted hz" style="font-size:20px">${wrong.map(w=>esc(w.h)).join(" · ")}</div>` : ""}
  </div>
  <div class="actions">
    <button class="primary" id="again">한 세트 더</button>
    <button class="secondary" id="home">처음으로</button>
    <button class="secondary" id="undo2">${ICON.undo}마지막 카드 다시 풀기</button></div>`;
  document.getElementById("undo2").onclick = undo;
  const a = document.getElementById("again"); if (a) a.onclick = () => startSession(mode);
  document.getElementById("home").onclick = renderHome;
}

/* ---------- match game ---------- */
function startMatch(){
  view = "match";
  let src = shuffle(W.filter(w => isWeak(card(w.h))));
  if (src.length < 5) src = src.concat(shuffle(W.filter(w => card(w.h) && card(w.h).s && !card(w.h).k && !src.includes(w))));
  if (src.length < 5) src = src.concat(shuffle(W.filter(w => !src.includes(w) && S.levels.includes(String(w.l)))));
  const set = src.slice(0, 5);
  const left = shuffle(set.map(w => ({h:w.h, t:disp(w), z:1}))), right = shuffle(set.map(w => ({h:w.h, t:w.m, z:0})));
  let sel = null, matched = 0, misses = 0; const t0 = Date.now();
  $app.innerHTML = `<div class="top"><button class="iconbtn" id="quit" aria-label="닫기">${ICON.x}</button><h1>짝맞추기</h1><span class="small muted" id="mm">0 / 5</span></div>
    <div class="scroll"><div class="small muted">한자와 뜻을 차례로 눌러 짝을 맞추세요. 약한 단어 위주로 나와요.</div>
    <div class="match" id="board">${left.map((a,i)=>`<button class="tile hzt" data-h="${esc(a.h)}" data-z="1">${esc(a.t)}</button><button class="tile" data-h="${esc(right[i].h)}" data-z="0">${esc(right[i].t)}</button>`).join("")}</div></div>
    <div class="actions" id="act"></div>`;
  document.getElementById("quit").onclick = renderHome;
  document.getElementById("board").onclick = e => {
    const b = e.target.closest(".tile"); if (!b || b.classList.contains("done")) return;
    if (b.dataset.z === "1") say(b.dataset.h);
    if (!sel || sel.dataset.z === b.dataset.z){ if (sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
    if (sel.dataset.h === b.dataset.h){
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); });
      matched++; document.getElementById("mm").textContent = matched + " / 5";
      if (matched === 5){
        const sec = Math.round((Date.now()-t0)/1000);
        document.getElementById("act").innerHTML = `<div class="verdict ok">${sec}초 · 실수 ${misses}번</div><div class="row2"><button class="primary" id="again">한 판 더</button><button class="secondary" id="home">처음으로</button></div>`;
        document.getElementById("again").onclick = startMatch; document.getElementById("home").onclick = renderHome;
      }
    } else {
      misses++; const a = sel; [a, b].forEach(x => x.classList.add("bad"));
      setTimeout(() => [a, b].forEach(x => x.classList.remove("bad","sel")), 450);
    }
    sel = null;
  };
}

/* ---------- bottom tabs ---------- */
function addNav(active){
  const nav = document.createElement("nav"); nav.className = "tabbar"; nav.setAttribute("aria-label", "메뉴");
  const T = [["home","学","홈"],["list","词","단어장"],["conj","连","접속사"],["hanzi","字","헷갈림 한자"]];
  nav.innerHTML = T.map(([k,z,t]) => `<button data-nav="${k}" ${k===active?'aria-current="page"':""}><b>${z}</b>${t}</button>`).join("");
  nav.onclick = e => { const b = e.target.closest("[data-nav]"); if (!b) return; const k = b.dataset.nav;
    if (k === "home") renderHome(); else if (k === "list") renderList("all"); else if (k === "conj") renderList("c"); else renderHanzi(); };
  $app.appendChild(nav);
}

/* ---------- 헷갈리는 한자 (노션 DB) ---------- */
const HG = (typeof HANZI === "undefined" ? [] : HANZI).map(([n, title, items]) => {
  const parts = title.split(" · ");
  const last = parts[parts.length - 1];
  const order = parts.length > 1 && /\s/.test(last) ? last.split(/\s+/) : [];
  const label = order.length ? parts.slice(0, -1).join(" · ") : title;
  const its = items.map(([k, txt]) => ({k, words: txt.split("\n").map(l => { const m = l.match(/^(.+?)\s*\[(.+?)\]\s*:\s*(.+)$/); return m ? {w:m[1].trim(), p:m[2], m:m[3]} : null; }).filter(Boolean)}));
  its.sort((a, b) => { const ia = order.indexOf(a.k), ib = order.indexOf(b.k); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  return {n, label, items: its};
});
let hq = "", hOpen = {};
function renderHanzi(){
  view = "hanzi";
  $app.innerHTML = `<div class="top"><h1>헷갈리는 한자</h1></div>
    <div><input class="search" id="hq" type="search" placeholder="한자 · 병음 · 뜻 검색" value="${esc(hq)}"></div>
    <div class="scroll" id="hs"></div>`;
  addNav("hanzi");
  const draw = () => {
    hq = document.getElementById("hq").value.trim();
    const plain = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s/g,"");
    const k = plain(hq);
    const gs = HG.filter(g => !hq || g.label.includes(hq) || g.items.some(it => it.k.includes(hq) || it.words.some(w => w.w.includes(hq) || w.m.includes(hq) || plain(w.p).includes(k))));
    const canDrill = HG.filter(g => g.items.length > 1).length;
    document.getElementById("hs").innerHTML = (hq ? "" : `<div class="small muted">비슷하게 생긴 한자 ${HG.length}개 그룹이에요. 한자를 누르면 그 한자가 들어간 단어가 나와요.</div>
      <button class="primary" id="hall" ${canDrill ? "" : "disabled"}>전체 섞어서 구분 연습</button>`) +
      (gs.length ? gs.map(g => { const on = hOpen[g.n];
        const it = g.items.find(x => x.k === on);
        return `<section class="hgroup" data-g="${g.n}">
          <div class="hhead"><span class="num">${g.n}</span><span class="lab hz">${esc(g.label)}</span>
            ${g.items.length > 1 ? `<button class="mini ok" data-drill="${g.n}">구분 연습</button>` : ""}</div>
          <div class="hchars">${g.items.map(x => `<button class="hchar${x.k === on ? " on" : ""}" data-k="${esc(x.k)}" aria-label="${esc(x.k)}">${esc(x.k)}</button>`).join("")}</div>
          ${it ? `<div class="hwords">${it.words.map(w => `<div class="hword"><span class="hz">${esc(w.w).split(esc(it.k)).join("<mark>" + esc(it.k) + "</mark>")}</span><span class="p">${esc(w.p)}</span>
            <button class="speak" data-say="${esc(w.w)}" aria-label="발음 듣기">${ICON.spk}</button><span class="m">${esc(w.m)}</span></div>`).join("")}</div>` : ""}
        </section>`; }).join("") : `<div class="empty">찾는 한자가 없어요.</div>`);
    const a = document.getElementById("hall"); if (a) a.onclick = () => startDrill(null);
  };
  document.getElementById("hq").oninput = draw;
  document.getElementById("hs").onclick = e => {
    const d = e.target.closest("[data-drill]"); if (d){ startDrill(+d.dataset.drill); return; }
    const c = e.target.closest(".hchar"); if (!c) return;
    const n = +c.closest(".hgroup").dataset.g;
    hOpen[n] = hOpen[n] === c.dataset.k ? null : c.dataset.k;
    if (hOpen[n]) say(c.dataset.k);
    const y = document.getElementById("hs").scrollTop; draw(); document.getElementById("hs").scrollTop = y;
  };
  draw();
}
// 구분 연습: 단어에서 한자 하나를 비우고, 같은 그룹의 비슷한 한자 중에서 고르기
let DQ = [], di = 0, dWrong = [], dGroup = null;
function startDrill(n){
  dGroup = n; di = 0; dWrong = [];
  const groups = HG.filter(g => g.items.length > 1 && (n == null || g.n === n));
  const qs = [];
  groups.forEach(g => g.items.forEach(it => it.words.forEach(w => { if (w.w.includes(it.k)) qs.push({g, k: it.k, w}); })));
  DQ = shuffle(qs).slice(0, 10);
  if (!DQ.length) return;
  view = "drill"; drawDrill();
}
function drawDrill(){
  const q = DQ[di], chars = q.g.items.map(x => x.k);
  const opts = shuffle([q.k, ...shuffle(chars.filter(c => c !== q.k)).slice(0, 5)]);
  const blanked = esc(q.w.w).replace(esc(q.k), `<span class="blank">＿</span>`);
  $app.innerHTML = `<div class="top"><button class="iconbtn" id="quit" aria-label="그만하기">${ICON.x}</button>
      <div class="progress"><i style="width:${di/DQ.length*100}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${di}/${DQ.length}</span></div>
    <div class="scroll"><div class="card"><div class="kind"><span class="stamp">${esc(q.g.label.split(" ")[0])}</span>구분 연습</div>
      <div class="center"><div class="small muted" style="text-align:center">빈칸에 들어갈 한자는?</div>
        <div class="drillq">${blanked}</div><div class="py">${esc(q.w.p)}</div><div class="mean">${esc(q.w.m)}</div></div>
      <div class="opts six" id="opts">${opts.map(o => `<button class="opt" data-k="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <div id="dfb"></div></div></div>
    <div class="actions" id="act"></div>`;
  document.getElementById("quit").onclick = renderHanzi;
  document.getElementById("opts").onclick = e => {
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    const ok = b.dataset.k === q.k;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.k === q.k) x.classList.add("right"); });
    if (!ok){ b.classList.add("wrong"); dWrong.push(q); }
    document.querySelector(".drillq").textContent = q.w.w;
    say(q.w.w);
    const other = q.g.items.find(x => x.k === b.dataset.k);
    document.getElementById("dfb").innerHTML = `<div class="verdict ${ok ? "ok" : "no"}" style="padding-top:8px">${ok ? "정답" : `${esc(b.dataset.k)} 는 ${other && other.words[0] ? esc(other.words[0].w) + " (" + esc(other.words[0].m) + ")" : "다른 한자"}에 쓰여요`}</div>`;
    const act = document.getElementById("act");
    act.innerHTML = `<button class="primary" id="nx">${di + 1 < DQ.length ? "다음" : "결과 보기"}</button>`;
    act.querySelector("#nx").onclick = () => { di++; if (di < DQ.length) drawDrill(); else drillDone(); };
  };
}
function drillDone(){
  $app.innerHTML = `<div class="top"><h1>구분 연습 완료</h1></div>
  <div class="done-box"><div class="big">${DQ.length - dWrong.length}/${DQ.length}</div>
    <div>${dWrong.length ? "헷갈린 단어" : "하나도 안 틀렸어요"}</div>
    ${dWrong.length ? `<div class="small muted hz" style="font-size:20px">${dWrong.map(q => esc(q.w.w)).join(" · ")}</div>` : ""}</div>
  <div class="actions"><button class="primary" id="again">한 번 더</button><button class="secondary" id="back">헷갈리는 한자로</button></div>`;
  document.getElementById("again").onclick = () => startDrill(dGroup);
  document.getElementById("back").onclick = renderHanzi;
}

/* ---------- word list ---------- */
let listQ = "";
function renderList(filter){
  view = "list";
  const tabs = [["all","전체"],["4","4급"],["5","5급"],["c","접속사"],["weak","약한"]];
  $app.innerHTML = `<div class="top"><button class="iconbtn" id="back" aria-label="뒤로">${ICON.back}</button><h1>${filter === "c" ? "접속사 정리" : filter === "weak" ? "약한 단어" : filter === "today" ? "오늘 푼 단어" : "단어장"}</h1></div>
    <div class="seg" id="tabs">${tabs.map(([k,t])=>`<button aria-pressed="${filter===k}" data-k="${k}">${t}</button>`).join("")}</div>
    <div style="padding-top:8px"><input class="search" id="q" type="search" placeholder="한자 · 병음 · 뜻 검색" value="${esc(listQ)}"></div>
    <div class="scroll">
      ${filter === "c" ? `<div class="small muted">짝으로 쓰이는 표현은 패턴째로 외워 두세요. 눌러서 예문과 차이점을 볼 수 있어요.</div><button class="primary" id="conjStudy">접속사만 한 세트 공부하기</button>` : ""}
      ${filter === "weak" ? `<div class="small muted">두 번 이상 틀렸거나 아직 낮은 단계인 단어예요. 잘못 눌러서 들어온 단어는 빼기를 누르세요.</div>` : ""}
      <div class="list" id="list"></div></div>`;
  const cs = document.getElementById("conjStudy"); if (cs) cs.onclick = () => startSession("conj");
  addNav(filter === "c" ? "conj" : filter === "all" || filter === "4" || filter === "5" ? "list" : "");
  document.getElementById("back").onclick = renderHome;
  document.getElementById("tabs").onclick = e => { const b = e.target.closest("button"); if (b) renderList(b.dataset.k); };
  const q = document.getElementById("q");
  const draw = () => {
    listQ = q.value.trim();
    const plain = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    let items = W.filter(w => filter === "all" || (filter === "weak" ? isWeak(card(w.h)) : filter === "c" ? w.c : filter === "today" ? (card(w.h) && card(w.h).t === today()) : String(w.l) === filter));
    if (listQ){ const k = plain(listQ); items = items.filter(w => disp(w).includes(listQ) || plain(w.p).replace(/[\s']/g,"").includes(k.replace(/[\s']/g,"")) || w.m.includes(listQ)); }
    const L = document.getElementById("list");
    if (!items.length){ L.innerHTML = `<div class="empty">${filter === "weak" ? "아직 약한 단어가 없어요. 두 번 이상 틀린 단어가 여기 모여요." : filter === "today" ? "오늘은 아직 푼 단어가 없어요." : "찾는 단어가 없어요."}</div>`; return; }
    const more = items.length - listShown;
    L.innerHTML = items.slice(0, listShown).map(w => { const c = card(w.h), b = c ? c.b : -1;
      return `<div class="item" role="button" tabindex="0" data-h="${esc(w.h)}"><span class="hz">${esc(disp(w))}</span><span class="p">${esc(w.p)}</span>
      ${filter === "weak" ? `<button class="mini" data-unweak="${esc(w.h)}" style="grid-row:span 2">빼기</button>`
        : c && c.k ? `<span class="chip" style="grid-row:span 2">알고 있음</span>`
        : `<span class="dots${isWeak(c)?" weak":""}" title="${b<0?"안 배움":b+"단계"}">${[1,2,3,4,5].map(i=>`<i class="${b>=i||(b>5&&i===5)?"on":""}"></i>`).join("")}</span>`}
      <span class="m">${esc(w.m)}</span></div>`; }).join("") + (more > 0 ? `<button class="secondary" id="moreList" style="border-radius:0">${more}개 더 보기</button>` : "");
  };
  let listShown = 150;
  q.oninput = () => { listShown = 150; draw(); }; draw();
  document.getElementById("list").onclick = e => {
    const uw = e.target.closest("[data-unweak]");
    if (uw){ const c = S.cards[uw.dataset.unweak]; c.x = 0; c.b = Math.max(c.b, 2); save(); draw(); return; }
    if (e.target.closest("#moreList")){ listShown += 300; draw(); return; }
    const uk = e.target.closest("[data-unknow]");
    if (uk){ const c = S.cards[uk.dataset.unknow]; c.k = 0; c.b = 1; c.d = today(); save(); draw(); return; }
    if (e.target.closest("[data-say],.detail")) return;
    const it = e.target.closest(".item"); if (!it) return;
    const open = it.querySelector(".detail"); if (open){ open.remove(); return; }
    const d = document.createElement("div"); d.className = "detail";
    d.style.cssText = "display:flex;flex-direction:column;gap:10px";
    const cc = card(it.dataset.h);
    d.innerHTML = exampleHTML(BY[it.dataset.h], false) + (cc && cc.k ? `<button class="mini ok" data-unknow="${esc(it.dataset.h)}" style="align-self:flex-start">다시 복습에 넣기</button>` : "");
    it.appendChild(d);
  };
}

renderHome();
})();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
